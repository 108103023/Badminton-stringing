<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b32"><title>羽球穿線記帳</title>
<style>
:root{--green:#123b32;--lime:#d8f36a;--bg:#f4f6f1;--card:#fff;--muted:#66736c;--line:#e2e8e1;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17231d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--green);color:white;padding:26px 18px 24px;border-radius:0 0 24px 24px}header .tag{font-size:12px;letter-spacing:1.5px;color:var(--lime)}h1{font-size:25px;margin:7px 0 5px}header p{margin:0;color:#d8e5de;font-size:14px}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-3px;margin-bottom:16px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:7px;font-size:19px;overflow-wrap:anywhere}.card{margin-bottom:14px;box-shadow:0 3px 12px #173d2810}.card h2{font-size:17px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;color:#435249}input,select,textarea{width:100%;min-height:44px;border:1px solid #d5ded5;border-radius:10px;padding:10px 11px;background:#fff;color:#17231d;font-size:16px}button{border:0;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:var(--green);color:white;width:100%;margin-top:13px}.secondary{background:#edf2eb;color:var(--green)}.danger{background:#fff0ee;color:var(--red);padding:8px 10px;font-size:13px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:150px}.record{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.record:first-child{border-top:0}.record strong{display:block;font-size:15px}.record .meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}.record .price{text-align:right;white-space:nowrap;font-weight:750}.empty{color:var(--muted);font-size:14px;padding:14px 0}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 2px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}@media(max-width:400px){.stat{padding:11px}.stat strong{font-size:16px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><header><div class="tag">BADMINTON • STRINGING LOG</div><h1>🏸 羽球穿線記帳</h1><p>每一支球拍、每一筆收入，都幫你記清楚。</p></header>
<main class="wrap"><section class="stats"><div class="stat"><small>本月穿線支數</small><strong id="count">0 支</strong></div><div class="stat"><small>本月總收入</small><strong id="income">$0</strong></div><div class="stat"><small>本月平均單價</small><strong id="average">$0</strong></div></section>
<section class="card"><h2>＋ 新增穿線紀錄</h2><form id="entryForm"><div class="grid">
<div class="field"><label for="date">日期 *</label><input id="date" type="date" required></div>
<div class="field"><label for="customer">客人姓名 *</label><input id="customer" placeholder="例如：小陳" required></div>
<div class="field"><label for="racket">球拍名稱</label><input id="racket" placeholder="例如：Astrox 100ZZ"></div>
<div class="field"><label for="string">球線名稱</label><input id="string" placeholder="例如：BG80"></div>
<div class="field"><label for="qty">穿線支數 *</label><input id="qty" type="number" min="1" step="1" value="1" required></div>
<div class="field"><label for="price">每支收費（元） *</label><input id="price" type="number" min="0" step="1" placeholder="例如：250" required></div>
<div class="field full"><label for="note">備註（選填）</label><input id="note" placeholder="例如：客人自備線、磅數 26/28"></div>
</div><button class="primary" type="submit">儲存這筆紀錄</button></form><p class="note">收入會依「支數 × 每支收費」自動計算。</p></section>
<section class="card"><h2>📒 穿線明細</h2><div class="toolbar"><input id="month" type="month" aria-label="選擇月份"><button class="secondary" id="allBtn" type="button">查看全部</button></div><div id="records"></div><div class="actions"><button class="secondary" id="exportBtn" type="button">匯出 CSV 備份</button><button class="secondary" id="importBtn" type="button">匯入備份</button><input class="hidden" id="fileInput" type="file" accept=".json,application/json"></div><p class="note">紀錄存在這台裝置的瀏覽器中。建議定期匯出備份；清除瀏覽器資料或更換手機可能導致紀錄遺失。</p></section>
</main><script>
const $=id=>document.getElementById(id);const KEY='badminton-stringing-records-v1';let records=[];
try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}
const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');$('month').value=$('date').value.slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const m=$('month').value;const shown=records.filter(r=>!m||r.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);const qty=shown.reduce((s,r)=>s+Number(r.qty),0);const total=shown.reduce((s,r)=>s+Number(r.qty)*Number(r.price),0);$('count').textContent=qty+' 支';$('income').textContent=money(total);$('average').textContent=money(qty?Math.round(total/qty):0);$('records').innerHTML=shown.length?shown.map(r=>`<div class="record"><div><strong>${esc(r.customer)} · ${esc(r.racket||'未填球拍')}</strong><div class="meta">${esc(r.date)} · ${esc(r.string||'未填球線')}<br>${r.qty} 支 × ${money(r.price)}${r.note?' · '+esc(r.note):''}</div></div><div><div class="price">${money(r.qty*r.price)}</div><button class="danger" style="margin-top:8px" onclick="removeRecord('${r.id}')">刪除</button></div></div>`).join(''):'<div class="empty">這個月份還沒有紀錄，新增第一筆吧！</div>'}
window.removeRecord=id=>{if(confirm('確定刪除這筆穿線紀錄？')){records=records.filter(r=>r.id!==id);save()}};
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const qty=Number($('qty').value),price=Number($('price').value);if(!Number.isFinite(qty)||qty<1||!Number.isFinite(price)||price<0){alert('請確認支數與收費輸入正確。');return}records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),created:Date.now(),date:$('date').value,customer:$('customer').value.trim(),racket:$('racket').value.trim(),string:$('string').value.trim(),qty,price,note:$('note').value.trim()});save();$('month').value=$('date').value.slice(0,7);$('customer').value='';$('racket').value='';$('string').value='';$('qty').value='1';$('price').value='';$('note').value='';$('customer').focus();window.scrollTo({top:0,behavior:'smooth'})});
$('month').addEventListener('change',render);$('allBtn').addEventListener('click',()=>{$('month').value='';render()});
$('exportBtn').addEventListener('click',()=>{const blob=new Blob(['\ufeff'+['日期,客人姓名,球拍名稱,球線名稱,支數,每支收費,總收入,備註',...records.map(r=>[r.date,r.customer,r.racket,r.string,r.qty,r.price,r.qty*r.price,r.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\r\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='羽球穿線紀錄.csv';a.click();URL.revokeObjectURL(a.href)});
$('exportBtn').addEventListener('contextmenu',e=>e.preventDefault());
// JSON backup is offered separately through the import/export backup control.
const backupBtn=document.createElement('button');backupBtn.type='button';backupBtn.className='secondary';backupBtn.textContent='匯出完整備份';backupBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='羽球穿線完整備份.json';a.click();URL.revokeObjectURL(a.href)});$('exportBtn').parentElement.insertBefore(backupBtn,$('importBtn'));
$('importBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(r=>r.date&&r.customer&&Number(r.qty)>=1&&Number(r.price)>=0))throw Error();if(confirm('匯入會把備份紀錄加入目前紀錄，確定繼續？')){const ids=new Set(records.map(r=>r.id));data.forEach(r=>{if(!ids.has(r.id))records.push({...r,id:r.id||Date.now().toString(36)+Math.random().toString(36).slice(2,7),created:r.created||Date.now()})});save();alert('備份匯入完成！')}}catch(err){alert('檔案格式不正確，請選擇先前匯出的完整備份 JSON。')}e.target.value=''});
render();
</script></body></html>
